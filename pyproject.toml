[project]
name = "grounded-rag-assistant"
version = "0.1.0"
description = "Permission-aware RAG assistant that answers only from approved knowledge, cites every sentence, and abstains instead of guessing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dharani Chalichama" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
backends = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gra = "assistant.cli:main"
gra-mcp = "assistant.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant", "assistant.backends"]

[tool.setuptools.package-data]
assistant = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a live Weaviate (set WEAVIATE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
