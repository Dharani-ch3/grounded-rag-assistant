# The assistant with Neo4j as the knowledge graph and Weaviate as the vector store.
#   docker compose up --build
# Then open http://localhost:8000 (Neo4j browser: http://localhost:7474, neo4j / localpassword)
services:
  assistant:
    build:
      context: .
      args: { BACKENDS: "true" }
    ports: ["8000:8000"]
    environment:
      ASSISTANT_GRAPH_STORE: neo4j
      ASSISTANT_VECTOR_STORE: weaviate
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: localpassword
      WEAVIATE_URL: http://weaviate:8080
    depends_on:
      neo4j: { condition: service_healthy }
      weaviate: { condition: service_started }
    restart: on-failure

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/localpassword
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p localpassword 'RETURN 1'"]
      interval: 5s
      retries: 30

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports: ["8080:8080"]
