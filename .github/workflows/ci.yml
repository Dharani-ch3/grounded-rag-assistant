name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q
      # Quality gate: a change that lets grounded mode leak, use a draft or outdated
      # version, or make up an answer fails the build.
      - name: Evaluation gate
        run: |
          python -m assistant.cli eval --fail-on-errors
          python -m assistant.cli eval --holdout --fail-on-errors

  backends:
    # The same evaluation with Weaviate as the vector store.
    runs-on: ubuntu-latest
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: none
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: node1
        ports: ["8080:8080"]
    env:
      WEAVIATE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Wait for Weaviate
        run: for i in $(seq 1 60); do curl -fs localhost:8080/v1/.well-known/ready && exit 0; sleep 2; done; exit 1
      - run: pytest -q -m integration tests/test_live_backends.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grounded-rag-assistant .
      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 --name gra grounded-rag-assistant
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/ask -H 'content-type: application/json' \
            -d '{"user":"ana","question":"How many PTO days do full-time employees get per year?"}' | grep -q "20 days"
